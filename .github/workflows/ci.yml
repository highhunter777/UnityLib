name: CI

# L1（dotnet 单测）门禁 —— 秒级、不需要 Unity。
# 依据《测试开发方案》§4 ① 与 §7.2 缺口 a、§7.3 改进 ①。
on:
  push:
    branches: [ LiteGame, main ]
  pull_request:
  workflow_dispatch:

jobs:
  l1-dotnet-test:
    name: L1 dotnet test（秒级）
    # 先用 windows 与本地已验证环境保持一致（FileSys / SettingService 等磁盘用例在 Windows 跑绿）。
    # 待确认 Linux 亦绿后，可改 ubuntu-latest（更快更省），或加 matrix 做跨平台校验。
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet test Tests/Tests.slnx
        run: dotnet test Tests/Tests.slnx --verbosity minimal
